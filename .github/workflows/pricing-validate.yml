# 價目表機械閘門:任何動到打包價目 JSON 的 PR(含每日定價 routine 的自動 PR)
# 都必須通過 schema + 漂移驗證,規則見 Scripts/validate-price-list.py。
#
# 兩道防繞過設計(審查發現後補強):
#   1. 觸發路徑包含驗證器與本 workflow 自身 —— 刪除/弱化閘門的 PR 也會跑此 job;
#   2. PR 上一律執行「base ref 的驗證器副本」—— 同一 PR 無法先改驗證器再夾帶壞資料
#      (base 尚無腳本時 = 首次引入,才退回使用 head 版本)。
# 已知且「接受」的殘餘限制:pull_request 執行的是 head 的 workflow 本體,同一 PR
# 仍可改寫本檔的執行步驟讓綠勾失去意義。此閘門定位為合併前的機械訊號。
# auto-merge 現況(owner 決策 2026-08-05):僅存在一條「窄通道」—— 排程 routine
# 對 bot evergreen PR 的 approve→普通 merge,且該通道以「diff 恰為
# model-prices-generated.json 單一檔」為硬性前提,動到本檔/腳本/curated 的 PR
# 一律不入通道、回到 owner 人工 —— 上述 workflow-rewrite 殘餘對窄通道因此封閉。
# 若未來要把 auto-merge 擴大到任意 PR,原前置條件不變:必須先以 ruleset /
# CODEOWNERS(.github/workflows/**)或 base-ref 執行模式封死 workflow-rewrite 這條路。
name: pricing-validate

on:
  pull_request:
    paths:
      - 'Sources/UsageCore/Resources/model-prices*.json'
      - 'Scripts/validate-price-list.py'
      - 'Scripts/pricing-drift-allowlist.json'
      - '.github/workflows/pricing-validate.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/UsageCore/Resources/model-prices*.json'
      - 'Scripts/validate-price-list.py'
      - 'Scripts/pricing-drift-allowlist.json'
      - '.github/workflows/pricing-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 漂移閘門與 base 驗證器副本都需要 base commit 內容
      - name: Validate price lists
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 雙跑,兩者皆須通過:
            #   base 副本 = 強制閘門(同一 PR 改不掉的既定規則);
            #   head 副本 = 驗證器自身健康檢查 —— 沒有這一跑,修改驗證器的 PR
            #   永遠不會執行到新版程式,語法/執行期錯誤會靜默合併後才炸在 main。
            if git show "$BASE_SHA:Scripts/validate-price-list.py" > /tmp/validate-base.py 2>/dev/null; then
              echo "== enforcing gates with BASE validator =="
              python3 /tmp/validate-base.py --base "$BASE_SHA"
              echo "== running HEAD validator (script health check) =="
              python3 Scripts/validate-price-list.py --base "$BASE_SHA"
            else
              echo "note: base has no validator (first introduction); using head copy"
              python3 Scripts/validate-price-list.py --base "$BASE_SHA"
            fi
          else
            python3 Scripts/validate-price-list.py
          fi
