# 完整 Swift 建置 + 測試套件(usagecore-tests,自帶 exit code)。
# CI runner 的工具鏈健全,直接用原生 swift 即可 —— 本機 Scripts/swiftpm.sh 的
# workaround 是這台開發機 CommandLineTools 損壞的補救,與 CI 無關。
# 註:價目 JSON 在 Sources/** 之下,純定價 PR「刻意」也會跑本 job ——
# Swift Codable 解碼是對價目資料更嚴格的端對端驗證(公開 repo 免費、約 30 秒)。
name: swift-tests

on:
  # 每個 PR 都跑(不設 paths):本 job 是 main 的 required status check,
  # path filter 會讓純文件 PR 的 required check 永遠 pending 而無法 merge。
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/workflows/swift-tests.yml'
      - '.github/workflows/release-app.yml'
      - 'Scripts/release-version.sh'
      - 'Scripts/reconcile-latest.sh'
      - 'Scripts/write-info-plist.sh'
      - 'Scripts/test-release-version.sh'
      # 簽名管線(PR-B):簽名實作與其離線 falsification 套件變更時,直推 main 也要觸發本 required check。
      - 'Scripts/build-app.sh'
      - 'Scripts/notarize-app.sh'
      - 'Scripts/test-signing-pipeline.sh'

jobs:
  tests:
    # 顯示名稱即 main ruleset 的 required status check context;請勿隨意更名。
    name: swift-tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Run test suite
        run: swift run usagecore-tests
      # canonical release 工具(docs/release/VERSIONING.md):版號文法、Info.plist 不變式、release-app.yml 接線守則。
      - name: Release tooling tests
        run: /bin/bash Scripts/test-release-version.sh
      # 簽名管線離線 falsification 套件(PR-B):以 fake 工具驗證 Developer ID 簽名/公證編排會 fail-closed(無憑證、不碰 Apple)。
      - name: Signing pipeline tests
        run: /bin/bash Scripts/test-signing-pipeline.sh
